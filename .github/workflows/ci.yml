name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  # ── Job 1: Lint the Django backend ─────────────────────────────────────────
  lint-backend:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"  # Caches pip downloads between runs for speed

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff linter
        run: ruff check .

  # ── Job 2: Lint & build the React frontend ──────────────────────────────────
  lint-frontend:
    name: Frontend Lint & Build (ESLint + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend  # All steps run inside the frontend/ folder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json  # Cache npm installs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Build (compile TypeScript & Vite bundle)
        run: npm run build
