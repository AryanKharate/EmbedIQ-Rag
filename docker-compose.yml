services:
  # ── Django RAG backend ─────────────────────────────────────────────────────
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-embediq_user}:${POSTGRES_PASSWORD:-embediq_pass}@db:5432/${POSTGRES_DB:-embediq_db}
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # ── React/Nitro frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    expose:
      - "3000"
    environment:
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
    depends_on:
      - web
    restart: unless-stopped

  # ── nginx reverse proxy ─────────────────────────────────────────────────────
  # Terminates HTTP on port 80, routes /api → web, / → frontend
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Serves document images directly from disk — same host directory
      # Django writes to (see web's `.:/app` mount) — so this works
      # regardless of Django's DEBUG setting.
      - ./media:/media:ro
    depends_on:
      - web
      - frontend
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-embediq_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-embediq_pass}
      - POSTGRES_DB=${POSTGRES_DB:-embediq_db}
    # Not published to the host — the app only needs to reach Postgres over
    # the internal compose network (db:5432). Uncomment to allow a local GUI
    # client to connect directly:
    # ports:
    #   - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-embediq_user} -d ${POSTGRES_DB:-embediq_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Qdrant vector store ─────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  hf_cache:
